name: Living Codebase Map Lint

# Place this file in your repository at: .github/workflows/map-lint.yml
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-living-map:
    name: Check Living Map Synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Living Map Drift Lint
        run: |
          python .agents/skills/living-codebase-map/scripts/living_map.py check
