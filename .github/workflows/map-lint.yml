name: Living Codebase Map Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-living-map:
    name: Check Living Map Synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Living Map Drift Lint
        run: |
          # Automatically detects script location and runs CI/CD lint
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py check
          elif [ -f ".agents/skills/living-codebase-map/scripts/living_map.py" ]; then
            python .agents/skills/living-codebase-map/scripts/living_map.py check
          elif [ -f "tools/living_map.py" ]; then
            python tools/living_map.py check
          else
            echo "Error: living_map.py not found"
            exit 1
          fi
