name: Living Codebase Map Guard

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-living-map:
    name: Check Living Map Synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Living Map Smart Drift Lint (MD5)
        run: |
          echo "🔍 Checking Living Codebase Map synchronization with codebase..."
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py check
          elif [ -f ".agents/skills/living-codebase-map/scripts/living_map.py" ]; then
            python .agents/skills/living-codebase-map/scripts/living_map.py check
          elif [ -f "tools/living_map.py" ]; then
            python tools/living_map.py check
          else
            echo "❌ Error: living_map.py not found"
            exit 1
          fi

      - name: Troubleshooting Message on Failure
        if: failure()
        run: |
          echo "=========================================================================="
          echo "❌ FAILED: PROJECT_MAP.md is out of sync or has line drift with codebase!"
          echo "🤖 Solution for Agent / Developer:"
          echo "   1. Open local IDE or terminal."
          echo "   2. Run chat command: 'map update' or CLI: 'python scripts/living_map.py update'"
          echo "   3. (Optional) Auto-repair with: 'python scripts/living_map.py check --fix'"
          echo "   4. Commit PROJECT_MAP.md and PROJECT_MAP.min.md, then push to GitHub."
          echo "=========================================================================="
          exit 1
