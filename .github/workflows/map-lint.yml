name: Living Codebase Map Guard

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  lint-living-map:
    name: Check Map, Index, and Graph Synchronization
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Package and JSON Artifacts
        run: |
          python -m pip install -e . --no-deps
          living-map --help > /dev/null
          python -m compileall -q scripts tests
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Run Living Map Smart Drift Lint (MD5)
        run: |
          echo "🔍 Checking Living Codebase Map synchronization with codebase..."
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py check
          elif [ -f ".agents/skills/living-codebase-map/scripts/living_map.py" ]; then
            python .agents/skills/living-codebase-map/scripts/living_map.py check
          elif [ -f "tools/living_map.py" ]; then
            python tools/living_map.py check
          else
            echo "❌ Error: living_map.py not found"
            exit 1
          fi

      - name: Enforce Codebase Fitness Gates
        run: |
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py fitness --strict
          elif [ -f ".agents/skills/living-codebase-map/scripts/living_map.py" ]; then
            python .agents/skills/living-codebase-map/scripts/living_map.py fitness --strict
          elif [ -f "tools/living_map.py" ]; then
            python tools/living_map.py fitness --strict
          else
            echo "❌ Error: living_map.py not found"
            exit 1
          fi

      - name: Enforce Operational Evidence Freshness
        run: |
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py evidence-status --strict
          fi

      - name: Guard Risky Changed Symbols
        run: |
          if [ -f "scripts/living_map.py" ]; then
            python scripts/living_map.py guard --base HEAD^ --fail-on high
          elif [ -f ".agents/skills/living-codebase-map/scripts/living_map.py" ]; then
            python .agents/skills/living-codebase-map/scripts/living_map.py guard --base HEAD^ --fail-on high
          elif [ -f "tools/living_map.py" ]; then
            python tools/living_map.py guard --base HEAD^ --fail-on high
          else
            echo "❌ Error: living_map.py not found"
            exit 1
          fi

      - name: Troubleshooting Message on Failure
        if: failure()
        run: |
          echo "=========================================================================="
          echo "❌ FAILED: PROJECT_MAP.md or .lcm machine state is out of sync!"
          echo "🤖 Solution for Agent / Developer:"
          echo "   1. Open local IDE or terminal."
          echo "   2. Run chat command: 'map update' or CLI: 'python scripts/living_map.py update'"
          echo "   3. (Optional) Auto-repair with: 'python scripts/living_map.py check --fix'"
          echo "   4. Commit PROJECT_MAP.md, PROJECT_MAP.min.md, and all .lcm JSON artifacts."
          echo "=========================================================================="
          exit 1
